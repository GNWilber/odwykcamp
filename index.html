<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OdwykCamp</title>

  <meta property="og:title" content="OdwykCamp" />
  <meta property="og:description" content="Na razie nie planujemy żadnego OdwykCampu." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="favicon.png" />
  <meta name="theme-color" content="#1d4f37" />

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=3" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wrap {
      width: 100%;
      max-width: 720px;
      padding: 20px 16px;
    }
    .empty-state-hero {
      padding: 48px 32px;
    }
    .empty-state-text {
      font-size: clamp(16px, 2.5vw, 19px);
      color: rgba(255, 255, 255, 0.95);
      margin: 10px auto 28px;
      max-width: 520px;
      line-height: 1.65;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="hero empty-state-hero">
      <div class="hero-inner">
        <div class="hero-brand-row">
          <img src="favicon.png" alt="Logo OdwykCamp" class="hero-logo">
          <h1><span class="brand-font">OdwykCamp</span></h1>
        </div>
        <p class="empty-state-text">
          Na razie nie planujemy żadnego <span class="brand-font">OdwykCampu</span>.<br>
          Chcesz być gospodarzem następnego? Napisz na Discord.
        </p>
        <a class="btn-cta" href="https://discord.gg/PBTQbRYrj6" target="_blank" rel="noopener">
          Dołącz na Discord (#obozy)
        </a>
      </div>
    </header>
  </main>
</body>
</html>
